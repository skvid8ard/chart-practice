fullnameOverride: "openresty-practice"

web:
  application:
    reloader: true
    probes:
      readinessProbe:
        httpGet:
          path: /index.html
          port: http
        initialDelaySeconds: 5
        periodSeconds: 15
      livenessProbe:
        httpGet:
          path: /index.html
          port: http
        initialDelaySeconds: 5
        periodSeconds: 15
        timeoutSeconds: 5
    resources:
      limits:
        cpu: "0.3"
        memory: "500Mi"
      requests:
        cpu: "0.1"
        memory: "100Mi"

  service:
    type: NodePort
    name: "proxy-2"
    nodePort: 32003

  ingress:
    enabled: false