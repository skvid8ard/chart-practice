---
# Source: openresty-art/charts/web/templates/configmap-conf.yaml
kind: ConfigMap
apiVersion: v1
metadata:
  name: art-web-conf
  labels:
    helm.sh/chart: web-0.1.0
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: art
    app.kubernetes.io/version: "1.19.9.1-centos-rpm"
    app.kubernetes.io/managed-by: Helm
data:
  default.conf: |
    server {
            listen       80;
            server_name  localhost;
    
            location / {
                root   /usr/local/openresty/nginx/html;
                index  index.html index.htm;
            }
    
            error_page   500 502 503 504  /50x.html;
            location = /50x.html {
                root   /usr/local/openresty/nginx/html;
            }
    }
---
# Source: openresty-art/charts/web/templates/configmap-html.yaml
kind: ConfigMap
apiVersion: v1
metadata:
  name: art-web-html
  labels:
    helm.sh/chart: web-0.1.0
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: art
    app.kubernetes.io/version: "1.19.9.1-centos-rpm"
    app.kubernetes.io/managed-by: Helm
data:
  50x.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta content="utf-8" http-equiv="encoding">
        <title>Error</title>
        <style>
            body {
                width: 35em;
                margin: 0 auto;
                font-family: Tahoma, Verdana, Arial, sans-serif;
            }
        </style>
    </head>
    <body>
    <h1>An error occurred.</h1>
    <p>Sorry, the page you are looking for is currently unavailable.<br/>
        Please try again later.</p>
    </body>
    </html>
  index.html: |
    <html>
    <head>
        <title>Тестовая страница</title>
        <meta charset="UTF-8">
    </head>
    <body>
    <h1>Тестовая страница</h1>
    
    </body>
    </html>
---
# Source: openresty-art/charts/web/templates/service.yaml
kind: Service
apiVersion: v1
metadata:
  name: art-web-svc
  labels:
    helm.sh/chart: web-0.1.0
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: art
    app.kubernetes.io/version: "1.19.9.1-centos-rpm"
    app.kubernetes.io/managed-by: Helm
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      name: proxy-2
      nodePort: 32003
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: art
---
# Source: openresty-art/charts/web/templates/deployment.yaml
kind: Deployment
apiVersion: apps/v1
metadata:
  name: art-web
  labels:
    helm.sh/chart: web-0.1.0
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: art
    app.kubernetes.io/version: "1.19.9.1-centos-rpm"
    app.kubernetes.io/managed-by: Helm
  annotations:
    reloader.stakater.com/auto: "true"
    configmap.reloader.stakater.com/reload: "openresty"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: art
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: art
    spec:
      containers:
        - name: art-web
          image: "openresty/openresty:centos-rpm"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            limits:
              cpu: "0.3"
              memory: 500Mi
            requests:
              cpu: "0.1"
              memory: 100Mi
          volumeMounts:
            - name: html
              mountPath: /usr/local/openresty/nginx/html/
            - name: config
              mountPath: /etc/nginx/conf.d/
      volumes:
        - name: html
          configMap:
            name: art-web-html
        - name: config
          configMap:
            name: art-web-conf
